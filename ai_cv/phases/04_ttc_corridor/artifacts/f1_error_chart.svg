<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">Danger-zone errors by trip before and after guarded TTC filtering</title>
  <desc id="desc">Grouped bars compare baseline false positives, guarded false positives, and guarded false negatives for six practice trips.</desc>
  <rect width="1040" height="600" fill="#f8fafc"/>
  <text x="70" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f172a">Where the danger-F1 errors come from</text>
  <text x="70" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#475569">Danger threshold: TTC &lt; 2.0 s · 600 frames per trip · one complete 3,600-frame evaluation</text>

  <line x1="80" y1="490" x2="995" y2="490" stroke="#64748b" stroke-width="1"/>
  <line x1="80" y1="110" x2="80" y2="490" stroke="#64748b" stroke-width="1"/>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">
    <text x="52" y="495">0</text>
    <text x="44" y="371">50</text>
    <text x="36" y="244">100</text>
    <text x="36" y="117">150</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 5">
    <line x1="80" y1="363.3" x2="995" y2="363.3"/>
    <line x1="80" y1="236.7" x2="995" y2="236.7"/>
    <line x1="80" y1="110" x2="995" y2="110"/>
  </g>

  <!-- T01: baseline FP 46, guarded FP 14, guarded FN 3 -->
  <rect x="115" y="373.5" width="28" height="116.5" rx="3" fill="#ef4444"/><text x="129" y="366" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">46</text>
  <rect x="148" y="454.5" width="28" height="35.5" rx="3" fill="#f59e0b"/><text x="162" y="447" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">14</text>
  <rect x="181" y="482.4" width="28" height="7.6" rx="3" fill="#3b82f6"/><text x="195" y="475" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">3</text>
  <!-- T02: 25,3,5 -->
  <rect x="260" y="426.7" width="28" height="63.3" rx="3" fill="#ef4444"/><text x="274" y="419" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">25</text>
  <rect x="293" y="482.4" width="28" height="7.6" rx="3" fill="#f59e0b"/><text x="307" y="475" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">3</text>
  <rect x="326" y="477.3" width="28" height="12.7" rx="3" fill="#3b82f6"/><text x="340" y="470" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">5</text>
  <!-- T03: 139,11,21 -->
  <rect x="405" y="137.9" width="28" height="352.1" rx="3" fill="#ef4444"/><text x="419" y="130" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">139</text>
  <rect x="438" y="462.1" width="28" height="27.9" rx="3" fill="#f59e0b"/><text x="452" y="455" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">11</text>
  <rect x="471" y="436.8" width="28" height="53.2" rx="3" fill="#3b82f6"/><text x="485" y="429" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">21</text>
  <!-- T04: 22,8,15 -->
  <rect x="550" y="434.3" width="28" height="55.7" rx="3" fill="#ef4444"/><text x="564" y="427" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">22</text>
  <rect x="583" y="469.7" width="28" height="20.3" rx="3" fill="#f59e0b"/><text x="597" y="462" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">8</text>
  <rect x="616" y="452" width="28" height="38" rx="3" fill="#3b82f6"/><text x="630" y="445" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">15</text>
  <!-- T05: 66,45,23 -->
  <rect x="695" y="322.8" width="28" height="167.2" rx="3" fill="#ef4444"/><text x="709" y="315" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">66</text>
  <rect x="728" y="376" width="28" height="114" rx="3" fill="#f59e0b"/><text x="742" y="369" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">45</text>
  <rect x="761" y="431.7" width="28" height="58.3" rx="3" fill="#3b82f6"/><text x="775" y="424" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">23</text>
  <!-- T06: 42,8,14 -->
  <rect x="840" y="383.6" width="28" height="106.4" rx="3" fill="#ef4444"/><text x="854" y="376" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">42</text>
  <rect x="873" y="469.7" width="28" height="20.3" rx="3" fill="#f59e0b"/><text x="887" y="462" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">8</text>
  <rect x="906" y="454.5" width="28" height="35.5" rx="3" fill="#3b82f6"/><text x="920" y="447" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12">14</text>

  <g font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#334155">
    <text x="162" y="520" text-anchor="middle">T01</text><text x="307" y="520" text-anchor="middle">T02</text>
    <text x="452" y="520" text-anchor="middle">T03</text><text x="597" y="520" text-anchor="middle">T04</text>
    <text x="742" y="520" text-anchor="middle">T05</text><text x="887" y="520" text-anchor="middle">T06</text>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">
    <rect x="235" y="550" width="18" height="18" rx="3" fill="#ef4444"/><text x="261" y="564">Baseline FP</text>
    <rect x="410" y="550" width="18" height="18" rx="3" fill="#f59e0b"/><text x="436" y="564">Guarded FP</text>
    <rect x="585" y="550" width="18" height="18" rx="3" fill="#3b82f6"/><text x="611" y="564">Guarded FN</text>
  </g>
  <text x="995" y="96" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#0f766e">FP total: 340 → 89 (−74%)</text>
</svg>
