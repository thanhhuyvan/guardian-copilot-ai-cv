name: Bug report
description: Report a reproducible AI/CV pipeline defect
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Code/model/config version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, frame IDs and evidence

