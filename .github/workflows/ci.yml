name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install contract test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate contracts and examples
        run: python ai_cv/phases/00_scope_interface/verify/verify_contracts.py

      - name: Run contract negative tests
        run: python -m unittest discover -s ai_cv/phases/00_scope_interface/tests -p "test_*.py"

      - name: Verify repository structure
        shell: pwsh
        run: ./ai_cv/verification/check_structure.ps1 -SkipDatasetCheck

      - name: Protect against committed competition assets
        shell: pwsh
        run: |
          $forbidden = @('Practice_Dataset', 'Hackathon_Dataset_Redacted', 'Package_starterkit', 'tmp')
          $found = $forbidden | Where-Object { Test-Path -LiteralPath $_ }
          if ($found) { throw "Forbidden competition/local assets committed: $($found -join ', ')" }
